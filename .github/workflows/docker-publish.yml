name: Build and Push Docker Image

# 触发条件：当你有代码 push（推送）到 main 分支时，自动开始打包
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 拉取仓库最新代码
      uses: actions/checkout@v4

    - name: 2. 登录到 Docker Hub
      uses: docker/login-action@v3
      with:
        # 这里会自动读取你刚才在 Settings 里配置的密钥
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 3. 设置 Docker Buildx (现代多架构构建工具)
      uses: docker/setup-buildx-action@v3

    - name: 4. 开始构建并推送到 Docker Hub
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # 🔴 这里会自动把镜像打包为：你的用户名/libretv:latest
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/libretv:latest
